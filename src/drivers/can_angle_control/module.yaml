module_name: can_angle_control
parameters:
  - group: CAN Angle Control
    definitions:
      CA_CTRL_ENABLE:
        description:
          short: Enable CAN angle control driver
        type: boolean
        default: 0
      CA_CTRL_BITRATE:
        description:
          short: CAN bitrate
        type: int32
        default: 1000000
        min: 10000
        max: 5000000
      CA_CTRL_TX_ID:
        description:
          short: CAN command frame ID
        type: int32
        default: 512
        min: 0
        max: 2047
      CA_CTRL_RX_ID:
        description:
          short: CAN feedback frame ID
        type: int32
        default: 513
        min: 0
        max: 2047
      CA_CTRL_DEV:
        description:
          short: CAN interface index
        type: int32
        default: 0
        min: 0
        max: 1
      CA_CTRL_MIN:
        description:
          short: Minimum allowed angle
        type: float
        default: -90.0
        min: -180.0
        max: 180.0
      CA_CTRL_MAX:
        description:
          short: Maximum allowed angle
        type: float
        default: 90.0
        min: -180.0
        max: 180.0
      CA_CTRL_RATE:
        description:
          short: Maximum angle slew rate
        type: float
        default: 360.0
        min: 0.0
        max: 10000.0
      CA_CTRL_TIMEOUT:
        description:
          short: Command and feedback timeout
        type: float
        default: 200.0
        min: 10.0
        max: 5000.0
      CA_CTRL_OFFSET:
        description:
          short: Zero offset
        type: float
        default: 0.0
        min: -180.0
        max: 180.0
      CA_CTRL_DIR:
        description:
          short: Direction invert
        type: boolean
        default: 0
